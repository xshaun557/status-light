<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>副屏状态灯</title>
  <style>
    /* 全局重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: #08080c;
      color: #d0d0d8;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      overflow: hidden;
      -webkit-user-select: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* 环境光晕：随当前状态淡入对应色调，强化“现在是什么状态”的语义。
       纯 CSS、零依赖；状态由 body[data-state] 驱动，切换有 0.9s 柔和过渡。 */
    #ambient {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(circle at 50% 46%, rgba(255, 255, 255, 0.025), transparent 62%);
      transition: background 0.9s ease;
    }
    body[data-state="red"] #ambient {
      background: radial-gradient(circle at 50% 46%, rgba(255, 59, 48, 0.16), transparent 66%);
    }
    body[data-state="yellow"] #ambient {
      background: radial-gradient(circle at 50% 46%, rgba(255, 204, 0, 0.14), transparent 66%);
    }
    body[data-state="green"] #ambient {
      background: radial-gradient(circle at 50% 46%, rgba(52, 199, 89, 0.14), transparent 66%);
    }

    /* 顶部状态文字（设计升级：更克制的字距与字重，并按状态轻微染色） */
    #status {
      position: fixed;
      top: 5vh;
      left: 0;
      right: 0;
      z-index: 1;
      text-align: center;
      font-size: clamp(34px, 7vw, 60px);
      font-weight: 600;
      letter-spacing: 0.1em;
      color: #f2f2f7;
      text-shadow: 0 0 18px rgba(255, 255, 255, 0.08);
      transition: color 0.5s ease, text-shadow 0.5s ease;
    }
    body[data-state="red"] #status {
      color: #ffd9d6;
      text-shadow: 0 0 24px rgba(255, 59, 48, 0.35);
    }
    body[data-state="yellow"] #status {
      color: #fff3cc;
      text-shadow: 0 0 24px rgba(255, 204, 0, 0.30);
    }
    body[data-state="green"] #status {
      color: #d4f7df;
      text-shadow: 0 0 24px rgba(52, 199, 89, 0.30);
    }

    /* 三色灯容器：竖向排列，手机竖屏友好；底部留白给图例/控件，避免与最低一盏灯重叠 */
    #lights {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4.5vh;
      height: 100%;
      padding-bottom: 15vh;
    }

    /* 灯：玻璃质感圆灯。基础为暗态（竖屏基准尺寸 vw，横屏在 media 内以 vh 重定义）。
       内发光高光 + 暗态彩色可辨；transition 覆盖 opacity / box-shadow / background / border-color。 */
    .light {
      position: relative;
      width: 32vw;
      height: 32vw;
      max-width: 165px;
      max-height: 165px;
      border-radius: 50%;
      background: #16161e;
      border: 2px solid #2a2a35;
      opacity: 1;
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.06),
                  inset 0 -10px 22px rgba(0, 0, 0, 0.45);
      transition: opacity 0.35s ease, box-shadow 0.35s ease,
                  background 0.35s ease, border-color 0.35s ease;
    }

    /* 玻璃高光：让灯“由内而外”被点亮，idle 与 active 通用 */
    .light::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 38%, rgba(255, 255, 255, 0.10), transparent 60%);
      opacity: 0.6;
      pointer-events: none;
    }
    .light.active::before {
      opacity: 0.9;
    }

    /* 待机基础态：每盏灯显示极淡的对应色，一眼可辨且明显“活着” */
    .light.red {
      background: rgba(255, 59, 48, 0.10);
      border-color: rgba(255, 59, 48, 0.40);
    }
    .light.yellow {
      background: rgba(255, 204, 0, 0.10);
      border-color: rgba(255, 204, 0, 0.40);
    }
    .light.green {
      background: rgba(52, 199, 89, 0.10);
      border-color: rgba(52, 199, 89, 0.40);
    }

    /* 红灯高亮（实底 + 发光 + 满不透明） */
    .light.red.active {
      background: #ff3b30;
      border-color: #ff3b30;
      box-shadow: 0 0 36px 8px rgba(255, 59, 48, 0.75),
                  0 0 80px 22px rgba(255, 59, 48, 0.4);
      opacity: 1;
    }

    /* 黄灯高亮 */
    .light.yellow.active {
      background: #ffcc00;
      border-color: #ffcc00;
      box-shadow: 0 0 36px 8px rgba(255, 204, 0, 0.75),
                  0 0 80px 22px rgba(255, 204, 0, 0.4);
      opacity: 1;
    }

    /* 绿灯高亮 */
    .light.green.active {
      background: #34c759;
      border-color: #34c759;
      box-shadow: 0 0 36px 8px rgba(52, 199, 89, 0.75),
                  0 0 80px 22px rgba(52, 199, 89, 0.4);
      opacity: 1;
    }

    /* 激活态轻微“呼吸”，把视线引向当前状态；尊重 prefers-reduced-motion */
    @media (prefers-reduced-motion: no-preference) {
      .light.active {
        animation: lamp-breathe 3.6s ease-in-out infinite;
      }
    }
    @keyframes lamp-breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }

    /* 图例：语义色点 + 文案，横排可换行，不使用装饰性分隔符 */
    #legend {
      position: fixed;
      bottom: 16vh;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 7px 16px;
      padding: 0 6vw;
    }
    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: clamp(11px, 2.8vmin, 15px);
      color: #9a9aa8;
      letter-spacing: 0.04em;
    }
    .chip {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      display: inline-block;
      flex: none;
    }
    .chip.red { background: #ff3b30; box-shadow: 0 0 6px rgba(255, 59, 48, 0.6); }
    .chip.yellow { background: #ffcc00; box-shadow: 0 0 6px rgba(255, 204, 0, 0.55); }
    .chip.green { background: #34c759; box-shadow: 0 0 6px rgba(52, 199, 89, 0.55); }
    .chip.idle { background: #3a3a46; }

    /* 底部按钮容器：全屏 + 静音，毛玻璃胶囊，避免重叠 */
    #controls {
      position: fixed;
      bottom: 11vh;
      left: 0;
      right: 0;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3vw;
    }

    /* 全屏 / 静音按钮共享样式（毛玻璃，按下有物理反馈） */
    #fullscreen-btn, #mute-btn {
      padding: 12px 26px;
      background: rgba(255, 255, 255, 0.05);
      color: #d0d0d8;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 999px;
      font-size: 4vw;
      letter-spacing: 1px;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.1s ease;
      cursor: pointer;
    }
    #fullscreen-btn:active, #mute-btn:active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.1);
    }

    /* 底部使用说明 */
    #hint {
      position: fixed;
      bottom: 3vh;
      left: 0;
      right: 0;
      z-index: 2;
      text-align: center;
      font-size: clamp(10px, 3vw, 14px);
      line-height: 1.5;
      color: #56565f;
      max-width: 92vw;
      margin: 0 auto;
      padding: 0 5vw;
    }

    /* 竖屏显式锁定：确保三盏灯始终竖向叠放 */
    @media (orientation: portrait) {
      #lights {
        flex-direction: column;
      }
    }

    /* 横屏（手机全屏常为 landscape）：三盏灯横向排列，尺寸以 vh 为基准 */
    @media (orientation: landscape) {
      #status {
        font-size: 5.3vh;
      }

      #lights {
        flex-direction: row;
        gap: 7vw;
      }

      .light {
        width: 36vh;
        height: 36vh;
        max-width: 36vh;
        max-height: 36vh;
      }

      #legend {
        bottom: 13vh;
      }

      #controls {
        bottom: 13vh;
      }

      #fullscreen-btn, #mute-btn {
        padding: 8px 20px;
        font-size: 3.2vh;
      }

      #hint {
        bottom: 3vh;
        font-size: 2.4vh;
        padding: 0 4vh;
      }
    }
  </style>
</head>
<body data-state="idle">
  <!-- 环境光晕（随状态变色） -->
  <div id="ambient"></div>

  <!-- 当前状态文字 -->
  <div id="status">待机</div>

  <!-- 三色灯（竖向：红 / 黄 / 绿） -->
  <div id="lights">
    <div class="light red"></div>
    <div class="light yellow"></div>
    <div class="light green"></div>
  </div>

  <!-- 状态图例：语义色点 + 文案 -->
  <div id="legend">
    <span class="legend-item"><i class="chip yellow"></i>工作中</span>
    <span class="legend-item"><i class="chip green"></i>完成</span>
    <span class="legend-item"><i class="chip red"></i>需介入</span>
    <span class="legend-item"><i class="chip idle"></i>待机</span>
  </div>

  <!-- 底部按钮：全屏 + 语音开关（部分手机需用户手势触发） -->
  <div id="controls">
    <button id="fullscreen-btn">进入全屏</button>
    <button id="mute-btn">语音开</button>
  </div>

  <!-- 使用说明 -->
  <div id="hint">
    如熄屏请关闭手机自动锁屏
  </div>

  <script>
    (function () {
      'use strict';

      // 状态 -> 中文文案
      var STATUS_TEXT = {
        idle: '待机',
        yellow: '工作中',
        green: '完成',
        red: '需要你介入'
      };

      var statusEl = document.getElementById('status');
      var lights = {
        red: document.querySelector('.light.red'),
        yellow: document.querySelector('.light.yellow'),
        green: document.querySelector('.light.green')
      };

      /**
       * 仅负责点亮对应灯（不含语音）
       * @param {string} state 状态
       */
      function setLights(state) {
        document.body.dataset.state = state;
        statusEl.textContent = STATUS_TEXT[state];
        for (var key in lights) {
          if (lights.hasOwnProperty(key)) {
            lights[key].classList.toggle('active', key === state);
          }
        }
      }

      /**
       * 根据状态点亮对应灯，并可选择语音播报
       * @param {string} state 状态
       * @param {boolean} [doSpeak=true] 是否语音播报（初始化传 false 避免突兀出声）
       */
      function applyState(state, doSpeak) {
        if (!STATUS_TEXT.hasOwnProperty(state)) {
          state = 'idle';
        }
        setLights(state);
        if (doSpeak !== false) {
          speakState(state);
        }
      }

      // --------------------------------------------------
      // 语音播报（原生 SpeechSynthesis，零依赖）
      // --------------------------------------------------
      var muted = false; // 默认语音开启

      /**
       * 朗读某状态对应的中文文案。静音或浏览器不支持时静默忽略。
       * @param {string} state 状态
       */
      function speakState(state) {
        if (muted) return;
        if (!('speechSynthesis' in window)) return;
        try {
          window.speechSynthesis.cancel(); // 取消上一段，避免快速变化排队叠加
          var u = new SpeechSynthesisUtterance(STATUS_TEXT[state]);
          u.lang = 'zh-CN';
          u.rate = 0.95;
          window.speechSynthesis.speak(u);
        } catch (err) {
          // 静默忽略
        }
      }

      /**
       * iOS 语音解锁：SpeechSynthesis 首次 speak 必须在用户手势同步栈内激活，
       * 否则后续由 SSE 触发的播报会无声。预热后取消即可。
       */
      function warmUpSpeech() {
        if (muted) return;
        if (!('speechSynthesis' in window)) return;
        try {
          var u = new SpeechSynthesisUtterance('');
          window.speechSynthesis.speak(u);
          window.speechSynthesis.cancel();
        } catch (err) {
          // 静默忽略
        }
      }

      // --------------------------------------------------
      // SSE 实时连接
      // --------------------------------------------------
      var eventSource = null;

      function connect() {
        eventSource = new EventSource('/stream');

        eventSource.onmessage = function (e) {
          try {
            var data = JSON.parse(e.data);
            applyState(data.state);
          } catch (err) {
            // 忽略解析错误
          }
        };

        // 断线时浏览器会自动重连；此处顺便尝试重新申请常亮
        eventSource.onerror = function () {
          requestWakeLock();
        };
      }

      // --------------------------------------------------
      // 屏幕常亮（Screen Wake Lock）
      // --------------------------------------------------
      var wakeLock = null;

      function requestWakeLock() {
        if ('wakeLock' in navigator) {
          navigator.wakeLock
            .request('screen')
            .then(function (lock) {
              wakeLock = lock;
            })
            .catch(function () {
              // 浏览器不支持或用户拒绝则静默忽略
            });
        }
      }

      // 页面重新可见时（如从后台切回）重新申请常亮
      document.addEventListener('visibilitychange', function () {
        if (document.visibilityState === 'visible') {
          requestWakeLock();
        }
      });

      // --------------------------------------------------
      // 全屏（状态自适应：进入 / 退出）
      // --------------------------------------------------
      var fullscreenBtn = document.getElementById('fullscreen-btn');
      var muteBtn = document.getElementById('mute-btn');

      // 静音开关：切换语音开/关，切回开时顺便预热 iOS 语音
      muteBtn.addEventListener('click', function () {
        muted = !muted;
        muteBtn.textContent = muted ? '语音关' : '语音开';
        if (!muted) {
          warmUpSpeech();
        }
      });

      /**
       * 兼容获取当前全屏元素（含 webkit 前缀）
       * @returns {Element|null} 当前全屏的元素
       */
      function getFullscreenElement() {
        return (
          document.fullscreenElement ||
          document.webkitFullscreenElement ||
          null
        );
      }

      /**
       * 进入全屏，兼容带 webkit 前缀的浏览器；
       * 失败时静默忽略并保持按钮可用（用户可再次点击）。
       */
      function enterFullscreen() {
        var el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen().catch(function () {});
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        }
      }

      /**
       * 退出全屏，兼容带 webkit 前缀的浏览器。
       */
      function exitFullscreen() {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(function () {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }

      /**
       * 根据当前全屏状态实时更新按钮文案（进/出）。
       * 在系统手势退出全屏后也会被 fullscreenchange 触发回正。
       */
      function updateFullscreenBtn() {
        var isFull = !!getFullscreenElement();
        fullscreenBtn.textContent = isFull ? '退出全屏' : '进入全屏';
        fullscreenBtn.disabled = false;
      }

      // 点击：依据当前状态决定进入还是退出全屏
      fullscreenBtn.addEventListener('click', function () {
        warmUpSpeech(); // 用户手势内预热，解锁 iOS 语音
        if (getFullscreenElement()) {
          exitFullscreen();
        } else {
          enterFullscreen();
        }
      });

      // 监听全屏状态变化（含 webkit 前缀），实时回正按钮文案
      document.addEventListener('fullscreenchange', updateFullscreenBtn);
      document.addEventListener('webkitfullscreenchange', updateFullscreenBtn);

      // --------------------------------------------------
      // 初始化
      // --------------------------------------------------
      // 首次用户交互（点击/触摸）预热语音，解决 iOS 由 SSE 触发时无声的问题
      document.addEventListener('click', warmUpSpeech, { once: true });
      document.addEventListener('touchstart', warmUpSpeech, { once: true });

      applyState('idle', false); // 默认待机（全暗，不语音）
      connect(); // 建立 SSE 连接
      requestWakeLock(); // 尝试保持屏幕常亮
      enterFullscreen(); // 页面加载后尝试进入全屏（失败时有按钮兜底）
    })();
  </script>
</body>
</html>
